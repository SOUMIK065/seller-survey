:root{
  color-scheme:light;
  --ink:#161B2B;
  --blue:#1B3A9E;
  --blue-d:#142B78;
  --blue-tint:#EEF2FD;
  --hl:#FFE14D;
  --red:#C8321E;
  --rule:#E2E5EB;
  --line:#C3CAD8;
  --muted:#586075;
  --paper:#FFFFFF;
  --display:"Seller Display","Segoe UI",Roboto,system-ui,-apple-system,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",Arial,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--text);-webkit-font-smoothing:antialiased}
button,label,summary{touch-action:manipulation}
[tabindex="-1"]:focus{outline:none}
.col{max-width:560px;margin:0 auto;padding:0 20px}
main.col{padding-top:22px;padding-bottom:140px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--paper)}
.top .col{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.brand{display:flex;align-items:center;font:800 17px/1 var(--display);color:var(--blue);letter-spacing:-.01em}
.brand svg{margin-right:9px;flex:none}
.count{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:3px;background:var(--rule)}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s ease}

/* intro */
.demo{margin:0 0 18px;padding:10px 12px;border-radius:8px;background:var(--hl);font-size:15px;line-height:1.4}
.thread{margin:6px 0 20px}
.bub{display:table;max-width:100%;margin:0 0 8px;padding:9px 15px;border-radius:19px 19px 19px 5px;background:#EDEFF4;font-size:17px;line-height:1.3;opacity:0;animation:pop .42s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro h1{font:800 40px/1.05 var(--display);letter-spacing:-.025em;margin:0 0 14px}
.intro p{margin:0 0 12px;max-width:34em}
.intro .lead{font-size:18px}
.ticks{list-style:none;margin:20px 0 6px;padding:0}
.ticks li{position:relative;padding-left:30px;margin:7px 0;font-weight:600}
.ticks li::before{content:"";position:absolute;left:5px;top:.28em;width:7px;height:14px;border:solid var(--blue);border-width:0 3px 3px 0;border-radius:1px;transform:rotate(42deg)}
.by{color:var(--muted);font-size:15px}
.priv{margin:26px 0 0;color:var(--muted);font-size:15px}
.priv summary{cursor:pointer;font-weight:600;color:var(--ink)}
.priv p{margin:8px 0 0}

/* steps */
.stephead h1{font:800 31px/1.08 var(--display);letter-spacing:-.02em;margin:4px 0 8px}
.stephead p{margin:0;color:var(--muted);max-width:32em}
.q{margin-top:32px;padding-top:30px;border-top:1px solid var(--rule)}
.stephead + .q{margin-top:26px}
.q h2{font:700 21px/1.25 var(--display);letter-spacing:-.01em;margin:0 0 6px}
.hint{margin:0 0 12px;color:var(--muted);font-size:15px}
.note{margin:12px 0 0;padding:2px 0 2px 14px;border-left:3px solid var(--red)}
.note b{color:var(--red)}
.note.idea{margin-top:10px;padding:12px 14px;border-left-color:var(--blue);background:var(--blue-tint);border-radius:0 12px 12px 0}
.note.idea b{color:var(--blue)}
.note ul{list-style:none;margin:8px 0 0;padding:0}
.note li{position:relative;padding-left:20px;margin:6px 0}
.note li::before{content:"";position:absolute;left:3px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--blue)}
.ask{margin:18px 0 0;font-weight:700}

/* choices */
.opts{margin:12px 0 0}
.opt{display:block;position:relative;margin:0 0 8px}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;left:0;top:0}
.opt .box{display:flex;align-items:flex-start;min-height:54px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.opt .mark{flex:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:1px 12px 0 0;border:2px solid #8E98AD;background:#fff}
.single .opt .mark{border-radius:50%}
.multi .opt .mark{border-radius:7px}
.opt .tick{width:18px;height:18px;overflow:visible}
.opt .tick path{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .22s ease-out}
.opt .txt{flex:1;min-width:0;padding-top:1px}
.opt .hl{-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 4px;margin:0 -4px;background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 62%/0% 84%;transition:background-size .24s ease-out}
.opt input:checked + .box{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt input:checked + .box .mark{border-color:var(--blue)}
.opt input:checked + .box .tick path{stroke-dashoffset:0}
.opt input:checked + .box .hl{background-size:100% 84%}
.opt input:focus + .box{outline:3px solid rgba(27,58,158,.35);outline-offset:2px}
.opt input:disabled + .box{opacity:.45;cursor:default}

/* text fields */
.field{margin:16px 0 0}
.field label{display:block;margin:0 0 6px;font-weight:600;font-size:15px}
.field label span{font-weight:400;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{outline:3px solid rgba(27,58,158,.3);outline-offset:1px;border-color:var(--blue)}
.fine{margin:14px 0 0;color:var(--muted);font-size:14px}

/* errors */
.err{display:none;margin:10px 0 0;color:var(--red);font-weight:600;font-size:15px}
.q.bad .err{display:block}
.q.bad .opt .box,.q.bad textarea{border-color:#E9A99E}

/* bottom bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav .row{display:flex}
.btn{-webkit-appearance:none;appearance:none;border:0;font:700 17px/1 var(--text);min-height:54px;padding:0 24px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.go{flex:1;background:var(--blue);color:#fff}
.btn.go:active{background:var(--blue-d)}
.btn.back{margin-right:10px;background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--blue-tint);color:var(--blue-d);min-height:48px;padding:0 18px;margin:0 8px 8px 0;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible{outline:3px solid rgba(27,58,158,.45);outline-offset:2px}
.sendfail{margin:0 0 10px;padding:10px 12px;border-left:3px solid var(--red);background:#FDF0EE;font-size:15px;line-height:1.4}

/* thank you */
.done h1{font:800 34px/1.08 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.done p{max-width:32em;margin:0 0 12px}
.stamp{display:inline-block;margin:10px 0 24px 4px;padding:10px 20px 9px;border:4px double var(--blue);border-radius:10px;color:var(--blue);text-align:center;transform:rotate(-6deg);animation:stamp .55s cubic-bezier(.2,.9,.3,1.15) both}
.stamp b{display:block;font:800 30px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.stamp small{display:block;margin-top:6px;font:700 13px/1.2 var(--text)}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-15deg)}55%{opacity:1;transform:scale(.94) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.share{margin:22px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.share h2{font:700 20px/1.25 var(--display);margin:0 0 6px}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.nojs{margin:0;padding:24px 20px;font-size:18px}

@media (min-width:700px){
  main.col{padding-top:40px}
  .intro h1{font-size:48px}
}
@media (prefers-reduced-motion:reduce){
  .bub{opacity:1;animation:none}
  .stamp{animation:none}
  .bar i,.opt .tick path,.opt .hl{transition:none}
}

<body>
<noscript><p class="nojs">This survey needs JavaScript. Please open the link in Chrome or Safari and try again.</p></noscript>

<header class="top" id="top">
  <div class="col">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="3" width="20" height="16" rx="4" fill="#FFE14D"/><path d="M5.5 11.2l3.7 3.6 7.3-7.6" fill="none" stroke="#1B3A9E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Seller survey
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<main class="col" id="app"></main>

<div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" id="hp" name="website" tabindex="-1" autocomplete="off"></label></div>

<div class="nav" id="nav">
  <div class="col">
    <p class="sendfail" id="sendfail" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn back" id="btnBack" hidden>Back</button>
      <button type="button" class="btn go" id="btnGo">Start the survey</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================================================================
     1. SETTINGS: the only things you normally need to change
     ================================================================ */
  var CONFIG = {
    ENDPOINT: "https://script.google.com/macros/s/AKfycbx5HiZDViuStKvVcsf3_rbzmqcaKkcNieuhuMIV5MtWyN79L6_asWb-Af94umE9fpHEow/exec",           // Paste your Google Apps Script web app URL between the quotes (see README.md)
    RESEARCHER: "Soumik",         // Optional: your name. Shown on the first screen as "Survey by ..."
    RANDOMIZE_IDEAS: true   // Show the idea questions in a different order for each person
  };

  /* ================================================================
     2. THE QUESTIONS
     type: single | multi | text | contact.  c = answer code, t = answer text shown (and saved).
     x: true = "exclusive" answer (clears the others).  s = score used for the interest score.
     Question ids starting with "idea_" are treated as idea questions by Code.gs.
     ================================================================ */
  var IDEA_OPTIONS = [
    { c: "need",  t: "Yes, I really need this",              s: 3 },
    { c: "help",  t: "Yes, it would help me",                s: 2 },
    { c: "maybe", t: "Maybe, I'd like to see how it works",  s: 1 },
    { c: "no",    t: "No, my current way is fine",           s: 0 },
    { c: "na",    t: "This isn't a problem for me",          s: null }
  ];

  var STEPS = [
    {
      title: "About your selling",
      blurb: "Three quick taps.",
      questions: [
        { id: "where", short: "Where they sell", type: "multi", required: true,
          text: "Where do you sell most?", hint: "Choose all that apply.",
          options: [
            { c: "fbpage",  t: "Facebook page" },
            { c: "fbother", t: "Facebook profile, groups or Marketplace" },
            { c: "insta",   t: "Instagram" },
            { c: "wa",      t: "WhatsApp (status, catalogue or groups)" },
            { c: "site",    t: "My own website or another app" },
            { c: "offline", t: "Offline shop or market stall" },
            { c: "none",    t: "I don't sell online yet", x: true }
          ] },
        { id: "orders", short: "Orders per week", type: "single", required: true,
          text: "About how many orders do you get in a normal week?",
          options: [
            { c: "lt5",   t: "Fewer than 5" },
            { c: "5_20",  t: "5 to 20" },
            { c: "21_50", t: "21 to 50" },
            { c: "gt50",  t: "More than 50" }
          ] },
        { id: "category", short: "What they sell", type: "single", required: true,
          text: "What do you mainly sell?",
          options: [
            { c: "fashion", t: "Clothing and fashion" },
            { c: "jewel",   t: "Jewellery and accessories" },
            { c: "craft",   t: "Handmade, crafts and home décor" },
            { c: "food",    t: "Food and homemade items" },
            { c: "beauty",  t: "Beauty and personal care" },
            { c: "gadget",  t: "Gadgets and electronics" },
            { c: "other",   t: "Something else" }
          ] }
      ]
    },
    {
      title: "How selling works today",
      blurb: "Your real routine, not the ideal one.",
      questions: [
        { id: "channels", short: "How orders arrive", type: "multi", required: true,
          text: "How do customers usually place orders with you?", hint: "Choose all that apply.",
          options: [
            { c: "wa",      t: "WhatsApp message" },
            { c: "call",    t: "Phone call" },
            { c: "dm",      t: "Facebook or Instagram message (DM)" },
            { c: "comment", t: "Comment on my post" },
            { c: "visit",   t: "They visit in person" },
            { c: "site",    t: "Through a website or app" }
          ] },
        { id: "headache", short: "Biggest headache (own words)", type: "text", required: false,
          text: "In your own words: what is the biggest headache in selling on Facebook or Instagram?",
          hint: "Optional. One or two lines is plenty." },
        { id: "trouble", short: "Biggest troubles (up to 3)", type: "multi", max: 3, required: true,
          text: "Which of these cause you the most trouble?", hint: "Choose up to 3.",
          options: [
            { c: "repeat",  t: "Answering the same questions again and again" },
            { c: "number",  t: "My phone number being public: calls and messages at any hour" },
            { c: "track",   t: "Keeping track of orders across chats and calls" },
            { c: "fakepay", t: "Fake or edited payment screenshots" },
            { c: "nopay",   t: "Buyers who ask a lot, then never pay" },
            { c: "courier", t: "Arranging courier pickup and tracking parcels" },
            { c: "reach",   t: "Finding new customers" },
            { c: "returns", t: "Returns, refunds and cancellations" },
            { c: "none",    t: "None of these", x: true }
          ] },
        { id: "fakepay", short: "Fake payment screenshot?", type: "single", required: true,
          text: "Has a buyer ever shown you a fake or edited payment screenshot?",
          options: [
            { c: "often",    t: "Yes, several times" },
            { c: "once",     t: "Yes, once or twice" },
            { c: "never",    t: "No, never that I know of" },
            { c: "noonline", t: "I don't take online payments" }
          ] }
      ]
    },
    {
      title: "Five early ideas",
      blurb: "These are early ideas, not a finished product. An honest “No” helps us as much as a “Yes”.",
      shuffle: true,
      questions: [
        { id: "idea_chat", short: "Idea: private chat + auto-replies", type: "single", required: true,
          tag: "Private chat with auto-replies",
          today: "You share your phone or WhatsApp number on Facebook or Instagram so buyers can reach you. Anyone can call or message at any hour, and the same questions keep coming.",
          idea: "A built-in chat with automatic replies to common and product questions. Seller and buyer talk inside it, so neither has to share a phone number.",
          text: "Would you want this?", options: IDEA_OPTIONS },
        { id: "idea_shop", short: "Idea: shop link", type: "single", required: true,
          tag: "Your own shop link",
          today: "Buyers comment “price?” or “available?”, then you collect their name, address and order details by hand.",
          idea: "Add each product once in a few taps and paste one shop link on your page. Buyers pick products (even from photos), enter their own address and order. You set every price and discount.",
          text: "Would you want this?", options: IDEA_OPTIONS },
        { id: "idea_orders", short: "Idea: all orders in one place", type: "single", required: true,
          tag: "All orders in one place",
          today: "Orders arrive by calls, WhatsApp, messages and comments, then end up in a notebook or scattered chats.",
          idea: "Every order in one simple list: who ordered what, the address, payment and dispatch status. You also get a once-a-day summary.",
          text: "Would you want this?", options: IDEA_OPTIONS },
        { id: "idea_pay", short: "Idea: verified payment", type: "single", required: true,
          tag: "Verified payment",
          today: "Some buyers send fake or edited payment screenshots, or promise to pay and never do.",
          idea: "An order is confirmed only after the payment is really received through a verified UPI checkout. Nothing to check by hand.",
          text: "Would you want this?", options: IDEA_OPTIONS },
        { id: "idea_courier", short: "Idea: courier pickup", type: "single", required: true,
          tag: "Courier pickup",
          today: "After each order you arrange the courier yourself: forms, pickup and tracking updates for the buyer.",
          idea: "Book a courier pickup and track the parcel from the same place.",
          text: "Would you want this?", options: IDEA_OPTIONS }
      ]
    },
    {
      title: "Putting it together",
      blurb: "Last few questions. Thank you for staying with us.",
      questions: [
        { id: "one_system", short: "All-in-one: what would you do", type: "single", required: true,
          tag: "All of it in one system",
          ideaLead: "Imagine one simple system with:",
          list: [
            "A shop link for your Facebook or Instagram page",
            "Private buyer chat with automatic replies, so no phone numbers are shared",
            "Orders confirmed only after verified UPI payment",
            "Every order in one place, with a daily summary",
            "Courier pickup booked from the same place"
          ],
          text: "If you had this, what would you do?",
          options: [
            { c: "now",    t: "Start using it as soon as it is ready" },
            { c: "try",    t: "Try it with a few orders first" },
            { c: "see",    t: "See it working and know the cost first" },
            { c: "keep",   t: "Keep using my current way" },
            { c: "unsure", t: "I am not sure" }
          ] },
        { id: "barriers", short: "What could stop them (up to 2)", type: "multi", max: 2, required: true,
          text: "What could stop you from using a system like this?", hint: "Choose up to 2.",
          options: [
            { c: "cost",  t: "The cost" },
            { c: "learn", t: "Learning a new app" },
            { c: "habit", t: "My customers prefer WhatsApp or calls" },
            { c: "trust", t: "Trusting online payments or a new platform" },
            { c: "tech",  t: "Slow internet or phone limits" },
            { c: "none",  t: "Nothing would stop me", x: true }
          ] },
        { id: "price", short: "Fair way to pay", type: "single", required: true,
          text: "If it really saved you time, which way of paying would feel fair?",
          options: [
            { c: "free",      t: "Only if it is free" },
            { c: "lt300",     t: "A small monthly fee, under ₹300" },
            { c: "300_700",   t: "A monthly fee of ₹300 to ₹700" },
            { c: "per_order", t: "A small fee only when I get an order" },
            { c: "unsure",    t: "I am not sure yet" }
          ] },
        { id: "pilot", short: "Would test early version", type: "single", required: true,
          text: "Would you test an early version and tell us what works?",
          options: [
            { c: "yes",   t: "Yes, contact me" },
            { c: "maybe", t: "Maybe, tell me more first" },
            { c: "no",    t: "Not right now" }
          ] },
        { id: "contact", type: "contact" },
        { id: "anything", short: "Anything missed (own words)", type: "text", required: false,
          text: "Anything we missed, or one thing you would really want?",
          hint: "Optional." }
      ]
    }
  ];

  var THREAD = ["Price?", "Is it available in M?", "Please send your number", "Is COD possible?"];

  window.SURVEY_DEF = STEPS; // read by tooling that prints the question list

  /* ================================================================
     3. SMALL HELPERS
     ================================================================ */
  var QMAP = {};
  STEPS.forEach(function (st) { st.questions.forEach(function (q) { QMAP[q.id] = q; }); });

  function $(id) { return document.getElementById(id); }
  function h(tag, attrs, kids) {
    var el = document.createElement(tag), k, v;
    if (attrs) {
      for (k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        v = attrs[k];
        if (v === false || v === null || v === undefined) continue;
        if (k === "class") el.className = v;
        else if (v === true) el.setAttribute(k, "");
        else el.setAttribute(k, v);
      }
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function opt(q, c) { for (var i = 0; i < q.options.length; i++) if (q.options[i].c === c) return q.options[i]; return null; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function genId() {
    var s = "";
    try {
      var b = new Uint8Array(9); (window.crypto || window.msCrypto).getRandomValues(b);
      for (var i = 0; i < b.length; i++) s += (b[i] % 36).toString(36);
    } catch (e) {
      for (var j = 0; j < 9; j++) s += Math.floor(Math.random() * 36).toString(36);
    }
    return "r" + Date.now().toString(36) + s;
  }
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  function store(key, val) {
    try {
      if (val === undefined) return window.localStorage.getItem(key);
      if (val === null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, val);
    } catch (e) {}
    return null;
  }

  /* ================================================================
     4. STATE
     ================================================================ */
  var SRC = (param("src").match(/^[A-Za-z0-9_-]{1,24}$/) || ["direct"])[0];
  var FIXED_ORDER = param("fixed") === "1";
  var S = {
    step: -1, answers: {}, text: {},
    contact: { name: "", reach: "", page: "" },
    ideaOrder: null, t0: 0, secs: null, id: genId(), sending: false, sent: false
  };
  var histOK = false;

  function stepQuestions(i) {
    var st = STEPS[i], qs = st.questions.slice();
    if (st.shuffle) {
      if (!S.ideaOrder) {
        var ids = qs.map(function (q) { return q.id; });
        S.ideaOrder = (CONFIG.RANDOMIZE_IDEAS && !FIXED_ORDER) ? shuffle(ids) : ids;
      }
      qs = S.ideaOrder.map(function (id) { return QMAP[id]; });
    }
    return qs;
  }
  function pilotAnswer() { return (S.answers.pilot || [])[0] || ""; }
  function contactActive() { var p = pilotAnswer(); return p === "yes" || p === "maybe"; }

  /* ================================================================
     5. RENDERING
     ================================================================ */
  var app = $("app");

  function tickSvg() {
    var NS = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
    s.setAttribute("viewBox", "0 0 18 18"); s.setAttribute("class", "tick"); s.setAttribute("aria-hidden", "true");
    p.setAttribute("d", "M2.5 9.6l4.3 4.2L15.6 3.8"); s.appendChild(p);
    return s;
  }

  function optionRow(q, o) {
    var inp = h("input", { type: q.type === "single" ? "radio" : "checkbox", name: "q_" + q.id, value: o.c });
    inp.addEventListener("change", function () { choose(q, o, inp); });
    return h("label", { class: "opt" }, [
      inp,
      h("span", { class: "box" }, [
        h("span", { class: "mark" }, [tickSvg()]),
        h("span", { class: "txt" }, [h("span", { class: "hl" }, [o.t])])
      ])
    ]);
  }

  function syncGroup(q, group) {
    var set = S.answers[q.id] || [], full = !!(q.max && set.length >= q.max);
    var inputs = group.querySelectorAll("input");
    for (var i = 0; i < inputs.length; i++) {
      var on = set.indexOf(inputs[i].value) > -1;
      inputs[i].checked = on;
      inputs[i].disabled = full && !on;
    }
  }

  function choose(q, o, inp) {
    var set = (S.answers[q.id] || []).slice();
    if (q.type === "single") {
      set = [o.c];
    } else if (inp.checked) {
      if (o.x) set = [o.c];
      else {
        set = set.filter(function (c) { return !opt(q, c).x; });
        if (!q.max || set.length < q.max) set.push(o.c);
      }
    } else {
      set = set.filter(function (c) { return c !== o.c; });
    }
    S.answers[q.id] = set;
    var sec = $("q_" + q.id);
    syncGroup(q, sec.querySelector(".opts"));
    setErr(sec, "");
    if (q.id === "pilot") updateContactCard();
  }

  function setErr(sec, msg) {
    if (!sec) return;
    var e = sec.querySelector(".err");
    if (e) e.textContent = msg || "";
    if (msg) sec.classList.add("bad"); else sec.classList.remove("bad");
  }

  function choiceBlock(q) {
    var sec = h("section", { class: "q " + q.type, id: "q_" + q.id });
    var titleId = "t_" + q.id, labelId = titleId;
    if (q.tag) {
      sec.appendChild(h("h2", { id: titleId }, [q.tag]));
      if (q.today) sec.appendChild(h("p", { class: "note" }, [h("b", null, ["Today. "]), q.today]));
      if (q.idea) sec.appendChild(h("p", { class: "note idea" }, [h("b", null, ["The idea. "]), q.idea]));
      if (q.list) {
        var ul = h("ul", null, q.list.map(function (t) { return h("li", null, [t]); }));
        sec.appendChild(h("div", { class: "note idea" }, [h("b", null, [q.ideaLead]), ul]));
      }
      labelId = "a_" + q.id;
      sec.appendChild(h("p", { class: "ask", id: labelId }, [q.text]));
    } else {
      sec.appendChild(h("h2", { id: titleId }, [q.text]));
      if (q.hint) sec.appendChild(h("p", { class: "hint" }, [q.hint]));
    }
    var group = h("div", { class: "opts", role: q.type === "single" ? "radiogroup" : "group", "aria-labelledby": labelId },
      q.options.map(function (o) { return optionRow(q, o); }));
    sec.appendChild(group);
    sec.appendChild(h("p", { class: "err", role: "alert" }, []));
    syncGroup(q, group);
    return sec;
  }

  function textBlock(q) {
    var sec = h("section", { class: "q text", id: "q_" + q.id });
    sec.appendChild(h("h2", { id: "t_" + q.id }, [q.text]));
    if (q.hint) sec.appendChild(h("p", { class: "hint" }, [q.hint]));
    var ta = h("textarea", { rows: "3", maxlength: "400", "aria-labelledby": "t_" + q.id });
    ta.value = S.text[q.id] || "";
    ta.addEventListener("input", function () { S.text[q.id] = ta.value; });
    sec.appendChild(ta);
    return sec;
  }

  // Shown only to people who answered "Yes" or "Maybe" to testing an early version.
  // Everything here is optional: nobody has to add anything to send their answers.
  function contactBlock() {
    var sec = h("section", { class: "q contact", id: "q_contact" });
    sec.appendChild(h("h2", { id: "t_contact" }, ["Want us to get in touch?"]));
    sec.appendChild(h("p", { class: "hint" }, ["Only if you would like to. You can leave all of this empty and still send your answers."]));
    function field(key, label, auto) {
      var inp = h("input", { type: "text", id: "c_" + key, autocomplete: auto || "off" });
      inp.value = S.contact[key] || "";
      inp.addEventListener("input", function () {
        S.contact[key] = inp.value;
        if (key === "reach") $("reachHint").hidden = true;
      });
      if (key === "reach") inp.addEventListener("blur", function () {
        var v = inp.value.trim();
        $("reachHint").hidden = !v || looksLikeContact(v);
      });
      return h("div", { class: "field" }, [h("label", { for: "c_" + key }, [label, h("span", null, [" (optional)"])]), inp]);
    }
    sec.appendChild(field("name", "Your name", "name"));
    sec.appendChild(field("reach", "Phone, WhatsApp number or email"));
    sec.appendChild(h("p", { class: "fine", id: "reachHint", hidden: true }, ["This does not look like a phone number or email. Check it, or clear it. You can still send your answers."]));
    sec.appendChild(field("page", "Your Facebook or Instagram page"));
    sec.appendChild(h("p", { class: "fine" }, ["Used only to contact you about this research. Stored separately from your answers and never shown publicly."]));
    return sec;
  }

  function updateContactCard() {
    var sec = $("q_contact");
    if (sec) sec.hidden = !contactActive();
  }

  function renderQ(q) {
    if (q.type === "contact") return contactBlock();
    if (q.type === "text") return textBlock(q);
    return choiceBlock(q);
  }

  function renderIntro() {
    S.step = -1;
    clear(app);
    if (!CONFIG.ENDPOINT) {
      app.appendChild(h("p", { class: "demo", role: "note" },
        ["Preview mode: answers are not saved. Add your Apps Script link in index.html to start collecting."]));
    }
    var intro = h("section", { class: "intro" });
    intro.appendChild(h("div", { class: "thread" }, THREAD.map(function (t, i) {
      return h("p", { class: "bub", style: "animation-delay:" + (150 + i * 170) + "ms" }, [t]);
    })));
    intro.appendChild(h("h1", { id: "stepTitle", tabindex: "-1" }, ["Sound familiar?"]));
    intro.appendChild(h("p", { class: "lead" },
      ["If you sell on Facebook, Instagram or WhatsApp, we'd like to hear how it really works for you: orders, messages, payments and parcels."]));
    intro.appendChild(h("p", null,
      ["This is independent research. Your honest answers decide what is worth building for sellers like you."]));
    if (CONFIG.RESEARCHER) intro.appendChild(h("p", { class: "by" }, ["Survey by " + CONFIG.RESEARCHER]));
    intro.appendChild(h("ul", { class: "ticks" }, [
      h("li", null, ["About 3 minutes"]),
      h("li", null, ["No sign-in"]),
      h("li", null, ["Contact details are optional"])
    ]));
    intro.appendChild(h("details", { class: "priv" }, [
      h("summary", null, ["What happens to my answers?"]),
      h("p", null, ["Your answers are used only for this research. Contact details are optional, kept separately from your answers, and never shown publicly."])
    ]));
    app.appendChild(intro);
    chrome();
  }

  function renderStep(i) {
    S.step = i;
    clear(app);
    var st = STEPS[i];
    app.appendChild(h("header", { class: "stephead" }, [
      h("h1", { id: "stepTitle", tabindex: "-1" }, [st.title]),
      h("p", null, [st.blurb])
    ]));
    stepQuestions(i).forEach(function (q) { app.appendChild(renderQ(q)); });
    updateContactCard();
    chrome();
  }

  function shareUrl() { return location.href.split("#")[0].split("?")[0] + "?src=share"; }

  function renderDone() {
    S.step = STEPS.length;
    clear(app);
    var date = "";
    try { date = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { date = new Date().toDateString(); }
    var sec = h("section", { class: "done" });
    sec.appendChild(h("div", { class: "stamp", "aria-hidden": "true" }, [h("b", null, ["Received"]), h("small", null, [date])]));
    sec.appendChild(h("h1", { id: "stepTitle", tabindex: "-1" }, ["Thank you."]));
    if (!CONFIG.ENDPOINT) sec.appendChild(h("p", { class: "demo", role: "note" }, ["Preview mode: this answer was not saved."]));
    sec.appendChild(h("p", null, ["Your answers are in. Every response is read by a person, and yours will help decide what gets built next."]));
    sec.appendChild(h("p", null, ["If you chose to be contacted, we may reach out for a short chat about your experience. Otherwise there is nothing more to do."]));
    var text = "A 3-minute survey for people who sell on Facebook, Instagram or WhatsApp. No sign-in:";
    var wa = h("a", { class: "btn soft", target: "_blank", rel: "noopener", href: "https://wa.me/?text=" + encodeURIComponent(text + " " + shareUrl()) }, ["Send on WhatsApp"]);
    var cp = h("button", { type: "button", class: "btn soft" }, ["Copy link"]);
    cp.addEventListener("click", function () { copyText(shareUrl(), cp); });
    sec.appendChild(h("div", { class: "share" }, [h("h2", null, ["Know another seller?"]), h("p", null, ["Their experience matters too. Share the survey with them."]), wa, cp]));
    app.appendChild(sec);
    chrome();
  }

  function copyText(text, btn) {
    function ok() { btn.textContent = "Link copied"; }
    function fallback() {
      var ta = h("textarea", { readonly: true, style: "position:fixed;opacity:0;top:0" });
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { window.prompt("Copy this link:", text); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }

  function chrome() {
    var n = STEPS.length, s = S.step;
    $("bar").style.width = (s < 0 ? 0 : s >= n ? 100 : ((s + 1) / n) * 100) + "%";
    $("count").textContent = (s >= 0 && s < n) ? "Step " + (s + 1) + " of " + n : "";
    $("nav").hidden = s >= n;
    $("btnBack").hidden = !(s >= 0 && s < n);
    $("btnGo").textContent = s < 0 ? "Start the survey" : (s < n - 1 ? "Next" : "Send my answers");
    $("btnGo").disabled = false;
    showFail("");
    window.scrollTo(0, 0);
    var t = $("stepTitle");
    if (t) { try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); } }
  }

  function showFail(msg) {
    var el = $("sendfail");
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  /* ================================================================
     6. NAVIGATION AND VALIDATION
     ================================================================ */
  function pushState(i) { if (histOK) { try { window.history.pushState({ s: i }, ""); } catch (e) {} } }

  function goStep(i) { pushState(i); if (i < 0) renderIntro(); else renderStep(i); }

  function looksLikeContact(s) { return /.+@.+\..+/.test(s) || s.replace(/\D/g, "").length >= 8; }

  // Only the choice questions marked required are checked. Contact details and the
  // open text boxes are never required.
  function validate(i) {
    var first = null;
    stepQuestions(i).forEach(function (q) {
      if (q.type !== "single" && q.type !== "multi") return;
      var sec = $("q_" + q.id), msg = "", n = (S.answers[q.id] || []).length;
      if (q.required && !n) msg = q.type === "single" ? "Choose one answer to continue." : "Choose at least one answer to continue.";
      setErr(sec, msg);
      if (msg && !first) first = sec;
    });
    return first;
  }

  function onNext() {
    if (S.step < 0) { S.t0 = Date.now(); goStep(0); return; }
    var bad = validate(S.step);
    if (bad) { try { bad.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) { bad.scrollIntoView(); } return; }
    if (S.step < STEPS.length - 1) goStep(S.step + 1); else submit();
  }

  function onBack() {
    if (S.step < 0 || S.sending) return;
    if (histOK) window.history.back(); else if (S.step === 0) renderIntro(); else renderStep(S.step - 1);
  }

  /* ================================================================
     7. BUILDING AND SENDING THE ANSWER
     ================================================================ */
  function derive(codes) {
    var sum = 0, n = 0;
    STEPS.forEach(function (st) { st.questions.forEach(function (q) {
      if (q.id.indexOf("idea_") !== 0) return;
      var c = (codes[q.id] || [])[0], o = c ? opt(q, c) : null;
      if (o && o.s !== null && o.s !== undefined) { sum += o.s; n++; }
    }); });
    var f = (codes.one_system || [])[0], p = (codes.pilot || [])[0], tier = "C";
    if ((f === "now" || f === "try") && p === "yes") tier = "A";
    else if ((f === "now" || f === "try" || f === "see") && (p === "yes" || p === "maybe")) tier = "B";
    return { interest: n ? Math.round(sum / n / 3 * 100) : null, tier: tier };
  }

  function buildPayload() {
    var answers = {}, codes = {}, schema = {};
    STEPS.forEach(function (st) { st.questions.forEach(function (q) {
      if (q.type === "contact") return;
      schema[q.id] = q.short;
      if (q.type === "text") {
        var t = String(S.text[q.id] || "").replace(/\s+/g, " ").trim();
        if (t) answers[q.id] = [t.slice(0, 400)];
        return;
      }
      var set = S.answers[q.id] || [];
      if (!set.length) return;
      codes[q.id] = set.slice();
      answers[q.id] = set.map(function (c) { return opt(q, c).t; });
    }); });
    // Contact details are sent only if the person chose to type something reachable.
    var contact = null;
    if (contactActive() && (S.contact.reach.trim() || S.contact.page.trim())) {
      contact = { name: S.contact.name.trim().slice(0, 80), reach: S.contact.reach.trim().slice(0, 120), page: S.contact.page.trim().slice(0, 200) };
    }
    var d = derive(codes);
    if (S.secs === null) S.secs = Math.max(0, Math.round((Date.now() - S.t0) / 1000));
    return {
      v: 1, id: S.id, src: SRC, secs: S.secs, lang: String(navigator.language || "").slice(0, 12),
      order: S.ideaOrder || [], schema: schema, answers: answers,
      interest: d.interest, tier: d.tier, contact: contact, hp: $("hp").value
    };
  }

  function send(payload, cb) {
    if (!CONFIG.ENDPOINT) { setTimeout(function () { cb(true); }, 500); return; }
    var body = JSON.stringify(payload), finished = false, timer;
    function done(ok) { if (finished) return; finished = true; clearTimeout(timer); cb(ok); }
    timer = setTimeout(function () { done(false); }, 25000);
    // text/plain body = a "simple" request, so the browser sends no preflight (Apps Script cannot answer one)
    fetch(CONFIG.ENDPOINT, { method: "POST", body: body })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j = null; try { j = JSON.parse(t); } catch (e) {}
        done(!!(j && j.ok));
      })
      .catch(function () {
        // Some in-app browsers block reading the reply. Send once more without reading it;
        // the server ignores a repeated response id, so nothing is counted twice.
        fetch(CONFIG.ENDPOINT, { method: "POST", body: body, mode: "no-cors" })
          .then(function () { done(true); }, function () { done(false); });
      });
  }

  function setSending(on) {
    S.sending = on;
    $("btnGo").disabled = on;
    $("btnBack").disabled = on;
    $("btnGo").textContent = on ? "Sending…" : "Send my answers";
  }

  function submit() {
    if (S.sending) return;
    var payload = buildPayload();
    setSending(true); showFail("");
    send(payload, function (ok) {
      setSending(false);
      if (ok) { S.sent = true; store("ss_pending", null); renderDone(); }
      else {
        store("ss_pending", JSON.stringify(payload));
        showFail("Your answers have not been sent yet. Check your internet connection, then tap Send my answers again. Nothing is lost.");
      }
    });
  }

  function retryPending() {
    if (!CONFIG.ENDPOINT) return;
    var raw = store("ss_pending");
    if (!raw) return;
    try { send(JSON.parse(raw), function (ok) { if (ok) store("ss_pending", null); }); } catch (e) { store("ss_pending", null); }
  }

  /* ================================================================
     8. START
     ================================================================ */
  $("btnGo").addEventListener("click", onNext);
  $("btnBack").addEventListener("click", onBack);
  window.addEventListener("popstate", function (e) {
    if (S.sent || S.sending) return;
    var s = (e.state && typeof e.state.s === "number") ? e.state.s : -1;
    if (s < 0) renderIntro(); else if (s < STEPS.length) renderStep(s);
  });
  try { window.history.replaceState({ s: -1 }, ""); histOK = true; if ("scrollRestoration" in window.history) window.history.scrollRestoration = "manual"; } catch (e) { histOK = false; }
  window.addEventListener("online", retryPending);

  renderIntro();
  retryPending();
})();
</script>
</body>
